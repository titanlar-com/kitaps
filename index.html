<script>
(function(){var k='kitapatlasi:wood',s='kitapatlasi:color-scheme',w='ceviz',m='dark';
try{var v=localStorage.getItem(k);
if(v===null){localStorage.removeItem(s);localStorage.setItem(k,w)}
else if(v==='ceviz'||v==='mese'||v==='akasya')w=v;
if(localStorage.getItem(s)==='light')m='light'}catch(e){}
document.documentElement.setAttribute('data-wood',w);document.documentElement.setAttribute('data-mantine-color-scheme',m)})();
</script>
<style>
#first-load{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:100vh;min-height:100dvh;padding:16px;box-sizing:border-box;background:var(--paper,#0e0a07);color:var(--ink,#f5efe6);font:1rem/1.5 'Outfit Variable',Outfit,system-ui,sans-serif}
#first-load p{margin:0}
#first-load span{display:flex;gap:5.6px;width:28px;height:28px}
#first-load i{display:block;flex:1;background:currentColor;animation:first-load var(--motion-busy) var(--motion-ease) infinite}
#first-load i:nth-of-type(1){animation-delay:calc(var(--motion-busy-step) * -2)}
#first-load i:nth-of-type(2){animation-delay:calc(var(--motion-busy-step) * -1)}
@keyframes first-load{0%{transform:scale(.6);opacity:0}50%,100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#first-load i{animation:none}}
</style>
