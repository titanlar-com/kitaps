<style>
 :root{--paper:#0e0a07;--ink:#f5efe6;--muted:#b6aa9b;--accent:#e4b75f;--focus:#f5efe6;color-scheme:dark}
 body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box;background:var(--paper);color:var(--ink);font:1rem/1.6 "Outfit Variable",Outfit,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
 main{max-width:32rem}
 h1{margin:0 0 .5rem;font:600 1.75rem/1.2 "Outfit Variable",Outfit,system-ui,sans-serif}
 p{margin:0 0 1rem;color:var(--muted)}
 a{color:var(--accent);font-weight:600}
 a:focus{outline:none}
 a:focus-visible{text-decoration:underline 3px var(--focus);text-underline-offset:4px}
 @media (forced-colors:active){a:focus-visible{outline:2px solid CanvasText}}
</style>
</head>
